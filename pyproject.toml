[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentvideo"
version = "0.1.0"
description = "AI agent (Claude + FFmpeg) that edits and creates videos from a plain-language description"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["anthropic>=2.3.0"]

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]
dev = ["pytest>=8", "httpx>=0.27", "fastapi>=0.110", "python-multipart>=0.0.9"]

[project.scripts]
agentvideo = "agentvideo.cli:main"
agentvideo-web = "agentvideo.web:main"

[tool.setuptools]
packages = ["agentvideo"]

[tool.setuptools.package-data]
agentvideo = ["static/*.html"]
