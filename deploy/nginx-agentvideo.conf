# AgentVideo reverse proxy. Self-contained: only answers for __DOMAIN__,
# so the other sites on this server are unaffected.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    client_max_body_size 1100m;          # matches MAX_UPLOAD_MB (1024) + form overhead
    client_body_timeout 600s;

    location / {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;     # stream big uploads instead of buffering to disk twice
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
